name: Build

on:
  workflow_call:
    inputs:
      build_type:
        description: Build release or nightly artifacts
        required: false
        type: string
        default: release
  workflow_dispatch:
    inputs:
      build_type:
        description: Artifact type to build
        required: true
        type: choice
        options:
          - release
          - nightly
        default: release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux }
          - { os: ubuntu-24.04-arm, platform: linux-aarch64 }
          - { os: ubuntu-latest, platform: macos-cross }
          - { os: windows-2022, platform: windows }
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    env:
      SCCACHE_GHA_ENABLED: true
      RUSTC_WRAPPER: sccache
      ACTIONS_CACHE_SERVICE_V2: on
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Expose GitHub Actions Cache Environment Variables
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env['ACTIONS_RESULTS_URL'] || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN'] || '');

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          run-install: false

      - name: Build and package
        shell: pwsh
        run: ./build.ps1 -Platform ${{ matrix.platform }} -BuildType ${{ inputs.build_type }}

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.platform }}
          path: out/*

      - name: Check Sccache
        run: pixi run -e test cache-stat
