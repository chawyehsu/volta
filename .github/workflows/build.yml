name: Build

on:
  workflow_call:
    inputs:
      build_type:
        description: Build release or nightly artifacts
        required: false
        type: string
        default: release
  workflow_dispatch:
    inputs:
      build_type:
        description: Artifact type to build
        required: true
        type: choice
        options:
          - release
          - nightly
        default: release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux }
          - { os: ubuntu-24.04-arm, platform: linux-aarch64 }
          - { os: macos-26, platform: macos }
          - { os: windows-2022, platform: windows }
    name: Build
    runs-on: ${{ matrix.os }}
    env:
      SCCACHE_GHA_ENABLED: true
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6
        with:
          run-install: false

      - name: Setup SCCache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Override Cargo Profile
        if: inputs.build_type != 'release'
        shell: bash
        run: |
          sed -i.bak 's/"--profile", "release"/"--profile", "ci"/' pixi.toml && rm pixi.toml.bak

      # Linux: build
      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'ubuntu-24.04-arm'
        run: pixi run build --target-platform ${{ matrix.os == 'ubuntu-latest' && 'linux-64' || 'linux-aarch64' }} --output-dir out

      # macOS: build
      - name: Build (macOS)
        if: matrix.os == 'macos-26'
        run: |
          mkdir out
          pixi run build --target-platform osx-arm64
          mv volta-*.conda out/volta-macos-arm.conda
          pixi run build --target-platform osx-64
          mv volta-*.conda out/volta-macos-x64.conda

      # Windows: build
      - name: Build (Windows)
        if: matrix.os == 'windows-2022'
        shell: pwsh
        run: |
          # Windows long-path issue workaround:
          New-Item -ItemType Junction -Path C:\w -Target "${{ github.workspace }}"
          cd C:\w
          mkdir out
          pixi run build --target-platform win-64
          mv volta-*.conda out/volta-windows.conda
          pixi run build --target-platform win-arm64
          mv volta-*.conda out/volta-windows-arm.conda

      - name: Package (Linux)
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'ubuntu-24.04-arm'
        run: |
          cd out
          mv volta*.conda volta.conda
          pixi run bsdtar -xf volta.conda
          mv pkg*.tar.zst pkg.tar.zst
          pixi run bsdtar -xf pkg.tar.zst
          cd bin
          ls
          ldd -v volta
          objdump -T volta | grep GLIBC | sed 's/.*GLIBC_\([.0-9]*\).*/\1/g' | sort -Vu
          filename="volta-${{ matrix.os == 'ubuntu-latest' && 'x86_64-unknown-linux-gnu' || 'aarch64-unknown-linux-gnu' }}.tar.gz"
          tar -zcvf "$filename" volta*
          mv "$filename" ../
          cd ${{ github.workspace }}

      - name: Package (macOS)
        if: matrix.os == 'macos-26'
        run: |
          cd out
          pixi run bsdtar -xf volta-macos-arm.conda
          mv pkg*.tar.zst pkg.tar.zst
          pixi run bsdtar -xf pkg.tar.zst
          rm *.tar.zst
          cd bin
          filename="volta-aarch64-apple-darwin.tar.gz"
          tar -zcvf "$filename" volta*
          mv "$filename" ../
          cd ..
          pixi run bsdtar -xf volta-macos-x64.conda
          mv pkg*.tar.zst pkg.tar.zst
          pixi run bsdtar -xf pkg.tar.zst
          rm *.tar.zst
          cd bin
          filename="volta-x86_64-apple-darwin.tar.gz"
          tar -zcvf "$filename" volta*
          mv "$filename" ../
          cd ${{ github.workspace }}

      - name: Package (Windows)
        if: matrix.os == 'windows-2022'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content Cargo.toml | Select-String '^version\s*=\s*"(.*)"').Matches.Groups[1].Value
          cd out
          pixi run bsdtar -xf volta-windows.conda
          mv pkg*.tar.zst pkg.tar.zst
          pixi run bsdtar -xf pkg.tar.zst
          rm *.tar.zst
          $filenameZip = "volta-x86_64-pc-windows-msvc.zip"
          $filenameMsi = "volta-x86_64-pc-windows-msvc.msi"
          Compress-Archive bin/volta*.exe $filenameZip
          cd ..
          candle wix/main.wxs -dVersion="$version" -dCargoTargetBinDir="out/bin" -o out/wix/volta-windows.wixobj
          light out/wix/volta-windows.wixobj -spdb -ext WixUIExtension -ext WixUtilExtension -o "out/$filenameMsi"
          cd out
          pixi run bsdtar -xf volta-windows-arm.conda
          mv pkg*.tar.zst pkg.tar.zst
          pixi run bsdtar -xf pkg.tar.zst
          rm *.tar.zst
          $filenameZip = "volta-aarch64-pc-windows-msvc.zip"
          $filenameMsi = "volta-aarch64-pc-windows-msvc.msi"
          Compress-Archive bin/volta*.exe $filenameZip
          cd ..
          candle wix/main.wxs -dVersion="$version" -dCargoTargetBinDir="out/bin" -o out/wix/volta-windows-arm.wixobj
          light out/wix/volta-windows-arm.wixobj -spdb -ext WixUIExtension -ext WixUtilExtension -o "out/$filenameMsi"
          cd ${{ github.workspace }}

      - name: Generate release checksums (Unix)
        if: matrix.os != 'windows-2022'
        run: |
          cd out
          for archive in volta-*.tar.gz; do sha256sum "$archive" > "$archive.sha256"; done

      - name: Create release checksums (Windows)
        if: matrix.os == 'windows-2022'
        shell: pwsh
        run: |
          Get-ChildItem out/volta-*.zip,out/volta-*.msi | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Set-Content "$($_.FullName).sha256"
          }

      # Upload artifacts
      - name: Upload (Unix)
        if: matrix.os != 'windows-2022'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.platform }}
          path: |
            out/volta-*.tar.gz
            out/volta-*.tar.gz.sha256

      - name: Upload (Windows)
        if: matrix.os == 'windows-2022'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.platform }}
          path: |
            out/volta-*.zip
            out/volta-*.zip.sha256
            out/volta-*.msi
            out/volta-*.msi.sha256
