name: Build

on:
  workflow_call:
    inputs:
      build_type:
        description: Build release or nightly artifacts
        required: false
        type: string
        default: release
  workflow_dispatch:
    inputs:
      build_type:
        description: Artifact type to build
        required: true
        type: choice
        options:
          - release
          - nightly
        default: release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux }
          - { os: ubuntu-24.04-arm, platform: linux-aarch64 }
          - { os: ubuntu-latest, platform: macos-cross }
          - { os: windows-2022, platform: windows }
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    env:
      SCCACHE_GHA_ENABLED: true
      RUSTC_WRAPPER: sccache
      ACTIONS_CACHE_SERVICE_V2: on
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Expose GitHub Actions Cache Environment Variables
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env['ACTIONS_RESULTS_URL'] || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN'] || '');

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          run-install: false

      - name: Override Cargo Profile
        if: inputs.build_type != 'release'
        shell: bash
        run: |
          sed -i.bak 's/"--profile", "release"/"--profile", "ci"/' pixi.toml && rm pixi.toml.bak

      # Linux: build
      - name: Build (Linux)
        if: matrix.platform == 'linux' || matrix.platform == 'linux-aarch64'
        run: pixi run build --target-platform ${{ matrix.platform == 'linux' && 'linux-64' || 'linux-aarch64' }} --output-dir out

      # macOS: cross-build from Linux
      - name: Download macOS SDK
        if: matrix.platform == 'macos-cross'
        run: |
          # Keep in sync with c_stdlib_version in pixi.toml
          SDK_VERSION=11.0
          SDK_DIR="$GITHUB_WORKSPACE/.pixi/macos-sdk"
          mkdir -p "$SDK_DIR"
          curl -fsSL --retry 3 --retry-delay 5 -o "$SDK_DIR/MacOSX${SDK_VERSION}.sdk.tar.xz" \
            "https://github.com/phracker/MacOSX-SDKs/releases/download/11.3/MacOSX${SDK_VERSION}.sdk.tar.xz"
          echo "d3feee3ef9c6016b526e1901013f264467bb927865a03422a9cb925991cc9783  $SDK_DIR/MacOSX${SDK_VERSION}.sdk.tar.xz" | sha256sum -c -
          tar -xf "$SDK_DIR/MacOSX${SDK_VERSION}.sdk.tar.xz" -C "$SDK_DIR"
          rm "$SDK_DIR/MacOSX${SDK_VERSION}.sdk.tar.xz"
          sed -i "s|__MACOS_SDK_ROOT__|$SDK_DIR/MacOSX${SDK_VERSION}.sdk|g" pixi.toml

      - name: Build (macOS cross)
        if: matrix.platform == 'macos-cross'
        run: |
          mkdir out
          pixi run build --build-platform linux-64 --target-platform osx-arm64
          mv volta-*.conda out/volta-macos-arm.conda
          pixi run build --build-platform linux-64 --target-platform osx-64
          mv volta-*.conda out/volta-macos-x64.conda

      # Windows: build
      - name: Build (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          # Windows long-path issue workaround:
          New-Item -ItemType Junction -Path C:\w -Target "${{ github.workspace }}"
          cd C:\w
          pixi run -e test cargo --help
          mkdir out
          pixi run build --target-platform win-64
          if (0 -ne $LASTEXITCODE) {
            exit $LASTEXITCODE
          }
          mv volta-*.conda out/volta-windows.conda
          pixi run build --target-platform win-arm64
          if (0 -ne $LASTEXITCODE) {
            exit $LASTEXITCODE
          }
          mv volta-*.conda out/volta-windows-arm.conda

      - name: Package (Linux)
        if: matrix.platform == 'linux' || matrix.platform == 'linux-aarch64'
        run: |
          cd out
          mv volta*.conda volta.conda
          pixi run -e build bsdtar -xf volta.conda
          mv pkg*.tar.zst pkg.tar.zst
          pixi run -e build bsdtar -xf pkg.tar.zst
          cd bin
          ls
          ldd -v volta
          objdump -T volta | grep GLIBC | sed 's/.*GLIBC_\([.0-9]*\).*/\1/g' | sort -Vu
          filename="volta-${{ matrix.platform == 'linux' && 'x86_64-unknown-linux-gnu' || 'aarch64-unknown-linux-gnu' }}.tar.gz"
          tar -zcvf "$filename" volta*
          mv "$filename" ../
          cd ${{ github.workspace }}

      - name: Package (macOS)
        if: matrix.platform == 'macos-cross'
        run: |
          cd out
          pixi run -e build bsdtar -xf volta-macos-arm.conda
          mv pkg*.tar.zst pkg.tar.zst
          pixi run -e build bsdtar -xf pkg.tar.zst
          rm *.tar.zst
          cd bin
          filename="volta-aarch64-apple-darwin.tar.gz"
          tar -zcvf "$filename" volta*
          mv "$filename" ../
          cd ..
          pixi run -e build bsdtar -xf volta-macos-x64.conda
          mv pkg*.tar.zst pkg.tar.zst
          pixi run -e build bsdtar -xf pkg.tar.zst
          rm *.tar.zst
          cd bin
          filename="volta-x86_64-apple-darwin.tar.gz"
          tar -zcvf "$filename" volta*
          mv "$filename" ../
          cd ${{ github.workspace }}

      - name: Package (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content Cargo.toml | Select-String '^version\s*=\s*"(.*)"').Matches.Groups[1].Value
          cd out
          pixi run -e build bsdtar -xf volta-windows.conda
          mv pkg*.tar.zst pkg.tar.zst
          pixi run -e build bsdtar -xf pkg.tar.zst
          rm *.tar.zst
          $filenameZip = "volta-x86_64-pc-windows-msvc.zip"
          $filenameMsi = "volta-x86_64-pc-windows-msvc.msi"
          Compress-Archive bin/volta*.exe $filenameZip
          cd ..
          candle wix/main.wxs -dVersion="$version" -dCargoTargetBinDir="out/bin" -o out/wix/volta-windows.wixobj
          light out/wix/volta-windows.wixobj -spdb -ext WixUIExtension -ext WixUtilExtension -o "out/$filenameMsi"
          cd out
          pixi run -e build bsdtar -xf volta-windows-arm.conda
          mv pkg*.tar.zst pkg.tar.zst
          pixi run -e build bsdtar -xf pkg.tar.zst
          rm *.tar.zst
          $filenameZip = "volta-aarch64-pc-windows-msvc.zip"
          $filenameMsi = "volta-aarch64-pc-windows-msvc.msi"
          Compress-Archive bin/volta*.exe $filenameZip
          cd ..
          candle wix/main.wxs -dVersion="$version" -dCargoTargetBinDir="out/bin" -o out/wix/volta-windows-arm.wixobj
          light out/wix/volta-windows-arm.wixobj -spdb -ext WixUIExtension -ext WixUtilExtension -o "out/$filenameMsi"
          cd ${{ github.workspace }}

      - name: Generate release checksums (Unix)
        if: matrix.platform != 'windows'
        run: |
          cd out
          for archive in volta-*.tar.gz; do sha256sum "$archive" > "$archive.sha256"; done

      - name: Create release checksums (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          Get-ChildItem out/volta-*.zip,out/volta-*.msi | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Set-Content "$($_.FullName).sha256"
          }

      # Upload artifacts
      - name: Upload (Unix)
        if: matrix.platform != 'windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.platform }}
          path: |
            out/volta-*.tar.gz
            out/volta-*.tar.gz.sha256

      - name: Upload (Windows)
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.platform }}
          path: |
            out/volta-*.zip
            out/volta-*.zip.sha256
            out/volta-*.msi
            out/volta-*.msi.sha256

      - name: Check Sccache
        run: pixi run -e test cache-stat
