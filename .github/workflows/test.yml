name: Test

on:
  push:
    paths-ignore:
      - ".vscode"
      - "*.md"
    branches:
      - main
  pull_request:
    paths-ignore:
      - ".vscode"
      - "*.md"
    branches:
      - main

permissions: {}

jobs:
  style_check:
    # skip if it's a release commit to the main branch
    if: "!(github.event_name == 'push' && contains(github.event.head_commit.message, 'chore(main): release'))"
    name: Style Check
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: true
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup SCCache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Run check
        run: cargo fmt --all --quiet -- --check

  tests:
    needs: style_check
    strategy:
      matrix:
        include:
          - { os: "ubuntu-latest" }
          - { os: "windows-latest" }
    name: Acceptance Tests
    runs-on: ${{ matrix.os }}
    env:
      RUST_BACKTRACE: full
      SCCACHE_GHA_ENABLED: true
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup SCCache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Run tests
        run: cargo test --all --features mock-network

      - name: Lint with clippy
        run: cargo clippy

      - name: Lint tests with clippy
        run: cargo clippy --tests --features mock-network

  smoke_tests:
    needs: tests
    # skip if it's a pull request and the commit message contains 'build(deps)', typically for dependabot
    if: "!(github.event_name == 'pull_request' && contains(github.event.head_commit.message, 'build(deps)'))"
    name: Smoke Tests
    runs-on: ubuntu-latest
    env:
      RUST_BACKTRACE: full
      SCCACHE_GHA_ENABLED: true
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup SCCache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Run tests
        run: cargo test --test smoke --features smoke-tests -- --test-threads 1

  ci_nightly_build:
    needs: tests
    name: Build Nightly
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/build.yml
    with:
      build_type: nightly

  shell_tests:
    needs: style_check
    name: Shell Script Tests
    runs-on: ubuntu-latest
    steps:
      - name: Setup BATS
        run: sudo npm install -g bats

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run tests
        run: bats dev/unix/tests/

  validate_installer_checksum:
    needs: shell_tests
    name: Validate installer checksum
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run check
        run: |
          cd dev/unix
          sha256sum --check SHASUMS256.txt
