name: Coverage

on:
  push:
    paths-ignore:
      - ".vscode"
      - "*.md"
    branches:
      - main
  pull_request:
    paths-ignore:
      - ".vscode"
      - "*.md"

permissions: {}

jobs:
  coverage:
    name: Code Coverage
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    # skip if the commit message contains 'build(deps)', typically for dependabot
    if: "!contains(github.event.head_commit.message, 'build(deps)')"
    env:
      KACHE_CACHE_DIR: ${{ github.workspace }}/.kache
      KACHE_RUNTIME_DIR: ${{ github.workspace }}/.kache-runtime
      KACHE_LOCAL_ONLY: "1"
      RUSTC_WRAPPER: kache
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute cache epoch
        id: cache-epoch
        shell: bash
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          run-install: false

      # Restore the latest snapshot on every run. Only main saves, and the
      # weekly epoch makes it at most one snapshot per job/platform per week
      # instead of one per commit.
      - name: Restore kache store
        id: kache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .kache
          key: kache-1.2.2-${{ runner.os }}-${{ runner.arch }}-coverage-${{ hashFiles('Cargo.lock') }}-${{ steps.cache-epoch.outputs.week }}
          restore-keys: |
            kache-1.2.2-${{ runner.os }}-${{ runner.arch }}-coverage-

      - name: Restore cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Run Coverage (tests)
        run: pixi run cargo-llvm-cov --workspace --features mock-network --no-report

      - name: Run Coverage (smoke)
        if: matrix.os == 'ubuntu-latest'
        run: pixi run cargo-llvm-cov --workspace --test smoke --features smoke-tests --no-report -- --test-threads 1

      - name: Generate Report
        shell: bash
        run: |
          # collect all package names
          pixi run cargo-metadata --format-version 1 --no-deps | jq -r '.packages[].name' | grep -v '^testkit$' > packages.txt
          # add --package for each package to the command
          PACKAGES=$(awk '{printf "-p %s ", $0}' packages.txt)
          # run the report command with all packages
          pixi run cargo-llvm-cov report $PACKAGES --lcov --output-path lcov-${{ matrix.os }}.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov*.info
          fail_ci_if_error: true
          use_oidc: true

      - name: Save kache store
        if: success() && github.ref == 'refs/heads/main' && steps.kache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .kache
          key: ${{ steps.kache.outputs.cache-primary-key }}

      - name: Check kache
        if: always()
        shell: bash
        run: |
          pixi run -e test cache-stats
          pixi run -e test kache stats --since 24h --format github >> "$GITHUB_STEP_SUMMARY"
