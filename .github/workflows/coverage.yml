name: Coverage

on:
  push:
    paths-ignore:
      - ".vscode"
      - "*.md"
    branches:
      - main
  pull_request:
    paths-ignore:
      - ".vscode"
      - "*.md"

permissions: {}

jobs:
  coverage:
    name: Code Coverage
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    # skip if the commit message contains 'build(deps)', typically for dependabot
    if: "!contains(github.event.head_commit.message, 'build(deps)')"
    env:
      SCCACHE_GHA_ENABLED: true
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Expose GitHub Actions Cache Environment Variables
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env['ACTIONS_RESULTS_URL'] || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN'] || '');

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          run-install: false

      - name: Run Coverage (tests)
        run: pixi run -e ci-coverage cargo llvm-cov --workspace --features mock-network --no-report

      - name: Run Coverage (smoke)
        if: matrix.os == 'ubuntu-latest'
        run: pixi run -e ci-coverage cargo llvm-cov --workspace --test smoke --features smoke-tests --no-report -- --test-threads 1

      - name: Generate Report
        shell: bash
        run: |
          # collect all package names
          pixi run -e ci-coverage cargo metadata --format-version 1 --no-deps | jq -r '.packages[].name' | grep -v '^testkit$' > packages.txt
          # add --package for each package to the command
          PACKAGES=$(awk '{printf "-p %s ", $0}' packages.txt)
          # run the report command with all packages
          pixi run -e ci-coverage cargo llvm-cov report $PACKAGES --lcov --output-path lcov-${{ matrix.os }}.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov*.info
          fail_ci_if_error: true
          use_oidc: true
