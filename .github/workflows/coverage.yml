name: Coverage

on:
  push:
    paths-ignore:
      - ".vscode"
      - "*.md"
    branches:
      - main
  pull_request:
    paths-ignore:
      - ".vscode"
      - "*.md"

permissions: {}

jobs:
  coverage:
    name: Code Coverage
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    if: github.actor != 'dependabot[bot]'
    env:
      SCCACHE_GHA_ENABLED: true
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup SCCache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-llvm-cov

      - name: Run Coverage (tests)
        run: cargo llvm-cov --workspace --features mock-network --no-report

      - name: Run Coverage (smoke)
        if: matrix.os == 'ubuntu-latest'
        run: cargo llvm-cov --workspace --test smoke --features smoke-tests --no-report -- --test-threads 1

      - name: Generate Report
        shell: bash
        run: |
          # collect all package names
          cargo metadata --format-version 1 --no-deps | jq -r '.packages[].name' | grep -v '^test-support$' > packages.txt
          # add --package for each package to the command
          PACKAGES=$(awk '{printf "-p %s ", $0}' packages.txt)
          # run the report command with all packages
          cargo llvm-cov report $PACKAGES --lcov --output-path lcov-${{ matrix.os }}.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov*.info
          fail_ci_if_error: true
