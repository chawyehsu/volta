name: Coverage

on:
  push:
    paths-ignore:
      - ".vscode"
      - "*.md"
    branches:
      - main
  pull_request:
    paths-ignore:
      - ".vscode"
      - "*.md"

permissions: {}

jobs:
  coverage:
    name: Code Coverage
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    if: github.actor != 'dependabot[bot]'
    env:
      SCCACHE_GHA_ENABLED: true
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup SCCache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@7a79fe8c3a13344501c80d99cae481c1c9085912 # v2.81.10
        with:
          tool: cargo-llvm-cov

      - name: Run Coverage (tests)
        run: cargo llvm-cov --workspace --features mock-network --no-report

      - name: Run Coverage (smoke)
        if: matrix.os == 'ubuntu-latest'
        run: cargo llvm-cov --workspace --test smoke --features smoke-tests --no-report -- --test-threads 1

      - name: Generate Report
        shell: bash
        run: |
          # collect all package names
          cargo metadata --format-version 1 --no-deps | jq -r '.packages[].name' | grep -v '^test-support$' > packages.txt
          # add --package for each package to the command
          PACKAGES=$(awk '{printf "-p %s ", $0}' packages.txt)
          # run the report command with all packages
          cargo llvm-cov report $PACKAGES --lcov --output-path lcov-${{ matrix.os }}.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov*.info
          fail_ci_if_error: true
