[workspace]
channels = ["https://prefix.dev/conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "linux-aarch64", "win-64"]
preview = ["pixi-build"]

# sync with rust-toolchain.toml
[workspace.build-variants]
rust_compiler_version = ["1.95.0"]

# See COMPATIBILITY.md
[workspace.target.win.build-variants]
c_compiler = ["vs2022"]
cxx_compiler = ["vs2022"]

[workspace.target.linux.build-variants]
c_stdlib = ["sysroot"]
c_stdlib_version = ["2.17"]

[workspace.target.osx.build-variants]
c_stdlib = ["macosx_deployment_target"]
c_stdlib_version = ["11.0"]

[tasks]
build = { cmd = "pixi build", description = "Build Volta" }

# ----------------- #
# Package definition #
# ----------------- #
[package]
name = "volta"
license = "BSD-2-Clause"
authors = [
  "Chawye Hsu <su+git@chawyehsu.com>",
  "David Herman <david.herman@gmail.com>",
  "Charles Pierce <cpierce.grad@gmail.com>",
]

[package.build]
backend = { name = "pixi-build-rust", version = "*" }
# sccache secrets for GitHub Actions
secrets = ["ACTIONS_RESULTS_URL", "ACTIONS_RUNTIME_TOKEN"]

[package.build-dependencies."if(osx)"]
# Provides the `codesign` command used by rattler-build when cross-compiling.
sigtool = "*"

[package.build.config]
# env = { RUSTC_WRAPPER = "sccache", SCCACHE_GHA_ENABLED = "true" }
# The default profile is "release" and it doesn't need to be specified explicitly
# but we explicitly set it here to provide a way to override it if needed, via
# regex/sed replacement
extra-args = ["--profile", "release"]

[package.build.target.osx.config.env]
# conda-forge cannot ship the macOS SDK; CI replaces this placeholder with the
# absolute SDK path before cross-building.
SDKROOT = "__MACOS_SDK_ROOT__"
CONDA_BUILD_SYSROOT = "__MACOS_SDK_ROOT__"

[dependencies]
# bsdtar to extract conda artifacts
libarchive = ">=3.8.7,<4"
