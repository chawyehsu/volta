[workspace]
channels = ["https://prefix.dev/conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "linux-aarch64", "win-64"]
preview = ["pixi-build"]

# sync with rust-toolchain.toml
[workspace.build-variants]
rust_compiler_version = ["1.95.0"]

# See COMPATIBILITY.md
[workspace.target.win.build-variants]
c_compiler = ["vs2022"]
cxx_compiler = ["vs2022"]

[workspace.target.linux.build-variants]
c_stdlib = ["sysroot"]
c_stdlib_version = ["2.17"]

[workspace.target.osx.build-variants]
c_stdlib = ["macosx_deployment_target"]
c_stdlib_version = ["11.0"]

[workspace.dependencies]
cargo-llvm-cov = ">=0.9.1,<0.10"
c-compiler = ">=2.0.0,<3"
kache = "==1.2.2"
rust = "~=1.95.0"
rust-src = "~=1.95.0"
pixi-build-rust = ">=0.5.7,<0.6"
sigtool = ">=0.1.3,<0.2"
rattler-build = ">=0.80.1,<0.81"

# ----------- #
# Environment #
# ----------- #

## Features
[feature.build.dependencies]
# rattler-build to extract conda artifacts (via `rattler-build package extract`)
rattler-build = { workspace = true }

[feature.cache.dependencies]
kache = { workspace = true }

[feature.cache.tasks]
cache-stats = { cmd = "kache stats --since 24h --full", description = "Show kache build cache statistics" }

[feature.coverage.dependencies]
cargo-llvm-cov = { workspace = true }

[feature.compilers.dependencies]
c-compiler = { workspace = true }
rust = { workspace = true }
rust-src = { workspace = true }

## Environments and tasks
[environments.test]
features = ["compilers", "cache"]

[environments.test.tasks]
fmt = { cmd = "cargo fmt --all", description = "Check code formatting" }
lint = { cmd = "cargo clippy", description = "Lint the code" }
lint-test = { cmd = "cargo clippy --tests --features mock-network", description = "Lint the test code" }
test = { cmd = "cargo test --all --features mock-network", description = "Acceptance tests" }
smoke-test = { cmd = "cargo test --test smoke --features smoke-tests -- --test-threads 1", description = "Smoke tests" }

[environments.coverage]
features = ["compilers", "cache", "coverage"]

[environments.coverage.tasks]
cargo-metadata = { cmd = "cargo metadata", description = "Run cargo metadata" }
cargo-llvm-cov = { cmd = "cargo llvm-cov", description = "Run coverage with llvm-cov" }

[environments.build]
features = ["build"]

[environments.build.tasks]
build = { cmd = "pixi build", description = "Build Volta" }

# ----------------- #
# Package definition #
# ----------------- #
[package]
name = "volta"
license = "BSD-2-Clause"
authors = [
  "Chawye Hsu <su+git@chawyehsu.com>",
  "David Herman <david.herman@gmail.com>",
  "Charles Pierce <cpierce.grad@gmail.com>",
]

[package.build-dependencies]
kache = { workspace = true }

[package.build-dependencies."if(osx)"]
# Provides the `codesign` command used by rattler-build when cross-compiling.
sigtool = { workspace = true, when = { any = ["__linux", "__win"] } }

[package.build]
backend = { name = "pixi-build-rust", workspace = true }
# kache configuration for GitHub Actions. The values are pulled from the
# parent environment at build time and baked into the build script, so they
# only exist when the cache environment is set up. Local builds get the same
# values from `scripts/env.ps1`, which `build.ps1` sources.
#
# Due to a flaw in the pixi-build backends, the underlying `rattler-build`
# enforces build-environment isolation. This prevents the Rust toolchain
# from accessing build host's Cargo cache and the `CARGO_HOME` env var,
# resulting in a performance degradation where all crates must be
# re-downloaded during every build. Including CARGO_HOME in the secrets,
# which is not ideal, allows developers to work around this issue for
# local builds. The same isolation moves `HOME` and the working directory
# into the throwaway build prefix, so kache's store and runtime directory
# must be passed in explicitly as well.
secrets = [
  "KACHE_CACHE_DIR",
  "KACHE_RUNTIME_DIR",
  "CARGO_HOME",
]

[package.build.config]
# The default profile is "release" and it doesn't need to be specified explicitly
# but we explicitly set it here to provide a way to override it if needed, via
# regex/sed replacement
extra-args = ["--profile", "release"]
# `pixi-build-rust` force-exports `RUSTC_WRAPPER="sccache"` whenever any
# `SCCACHE*` variable is visible, so the kache wrapper below only survives
# when the environment is free of them. `scripts/env.ps1` strips them.
#
# `KACHE_LOCAL_ONLY` keeps kache off any remote or planner configuration;
# the CI store is persisted with `actions/cache` instead.
env = { RUSTC_WRAPPER = "kache", KACHE_LOCAL_ONLY = "1" }

[package.build.target.osx.config.env]
# conda-forge cannot ship the macOS SDK; CI replaces this placeholder with the
# absolute SDK path before cross-building.
SDKROOT = "__MACOS_SDK_ROOT__"
CONDA_BUILD_SYSROOT = "__MACOS_SDK_ROOT__"

[package.build.target.win-arm64.config.env]
# Use CMake to build aws-lc-sys, because conda's CFLAGS inject -O2 which
# overrides the -O0 required by jitterentropy-base.c.
AWS_LC_SYS_CMAKE_BUILDER = "1"
