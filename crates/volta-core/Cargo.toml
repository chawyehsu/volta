[package]
name = "volta-core"
version = "0.1.0"
authors = ["David Herman <david.herman@gmail.com>"]
edition = "2021"

[dependencies]
cfg-if.workspace = true
chain-map.workspace = true
chrono.workspace = true
ci_info.workspace = true
cmdline_words_parser.workspace = true
console.workspace = true
ctrlc.workspace = true
detect-indent.workspace = true
dirs.workspace = true
dunce.workspace = true
envoy.workspace = true
flate2.workspace = true
fs2.workspace = true
headers.workspace = true
httpdate.workspace = true
indexmap.workspace = true
indicatif.workspace = true
log.workspace = true
mockito = { workspace = true, optional = true }
node-semver.workspace = true
once_cell.workspace = true
os_info.workspace = true
percent-encoding.workspace = true
readext.workspace = true
regex.workspace = true
retry.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
tar.workspace = true
tee.workspace = true
tempfile.workspace = true
terminal_size.workspace = true
textwrap.workspace = true
thiserror.workspace = true
volta-layout.workspace = true
walkdir.workspace = true
which.workspace = true

[target.'cfg(all(windows, target_arch = "aarch64"))'.dependencies]
attohttpc = { workspace = true, features = ["tls-rustls-native-roots-ring"] }

[target.'cfg(not(all(windows, target_arch = "aarch64")))'.dependencies]
attohttpc = { workspace = true, features = ["tls-rustls-native-roots"] }

[target."cfg(windows)".dependencies]
junction.workspace = true
verbatim.workspace = true
winreg.workspace = true
zip_rs.workspace = true

[features]
# The `cross-platform-docs` feature flag is used for generating API docs for
# multiple platforms in one build.
# See ci/publish-docs.yml for an example of how it's enabled.
# See volta-core::path for an example of where it's used.
cross-platform-docs = []
mock-network = ["mockito"]
