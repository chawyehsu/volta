[package]
name = "volta"
description = "The Hassle-Free JavaScript Tool Manager"
version = "2.0.3"
authors = [
  "Chawye Hsu <su+git@chawyehsu.com>",
  "David Herman <david.herman@gmail.com>",
  "Charles Pierce <cpierce.grad@gmail.com>",
]
license = "BSD-2-Clause"
categories = ["development-tools"]
repository = "https://github.com/chawyehsu/volta"
edition = "2024"

[workspace]
members = ["crates/*"]

[workspace.dependencies]
# external deps
attohttpc = { version = "0.31.0", default-features = false, features = ["compress", "json"] }
cfg-if = "1.0"
chain-map = "0.1.0"
# We manually configure the feature list here because 0.4.16 includes the
# `oldtime` feature by default to avoid a breaking change. Additionally, using
# the feature list explicitly lets us drop the `wasmbind` feature, which we do
# not need.
chrono = { version = "0.4.44", default-features = false, features = ["alloc", "clock", "std"] }
ci_info = "0.14.15"
clap = { version = "4.6.1", features = ["color", "derive", "wrap_help"] }
clap_complete = "4.6.5"
cmdline_words_parser = "0.2.1"
console = ">=0.11.3, <1.0.0"
ctrlc = "3.5.2"
detect-indent = "0.1"
dirs = "6.0.0"
dunce = "1.0.5"
envoy = "0.1.3"
flate2 = "1.1"
fs2 = "0.4.3"
hamcrest2 = "0.3.0"
headers = "0.4"
hex = "0.4"
httpdate = "1"
indexmap = "2.14.0"
indicatif = "0.18.4"
junction = "2.0.0"
log = { version = "0.4", features = ["std"] }
mockito = "1.7.2"
node-semver = "2"
once_cell = "1.21.4"
os_info = "3.15.0"
percent-encoding = "2.3.2"
proc-macro2 = "1.0.106"
quote = "1.0.2"
readext = "0.1.0"
regex = "1.12.3"
retry = "2"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
self_update = { version = "1.3.3", default-features = false, features = ["archive-tar", "archive-zip", "compression-tar-gz", "compression-zip-deflate", "github", "ureq", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10"
syn = "3.0"
tar = "0.4.46"
tee = "0.1.0"
tempfile = "3.27.0"
terminal_size = "0.4.4"
# path crates
test-support = { path = "crates/test-support" }
textwrap = "0.16.2"
thiserror = "2.0.18"
verbatim = "0.1"
volta-core = { path = "crates/volta-core" }
volta-layout = { path = "crates/volta-layout" }
volta-layout-macro = { path = "crates/volta-layout-macro" }
volta-migrate = { path = "crates/volta-migrate" }
walkdir = "2.5.0"
which = "8.0.2"
winreg = "0.56.0"
# Set features manually to drop usage of `time` crate: we do not rely on that
# set of capabilities, and it has a vulnerability. We also don't need to use
# every single compression algorithm feature since we are only downloading
# Node as a zip file
zip_rs = { package = "zip", version = "=2.4.2", default-features = false, features = ["bzip2", "deflate"] }

[[bin]]
name = "volta-shim"
path = "src/volta-shim.rs"

[[bin]]
name = "volta-migrate"
path = "src/volta-migrate.rs"

[dependencies]
attohttpc.workspace = true
clap.workspace = true
clap_complete.workspace = true
dirs.workspace = true
flate2.workspace = true
# hex required by selfupdate
hex.workspace = true
log.workspace = true
mockito = { workspace = true, optional = true }
node-semver.workspace = true
once_cell.workspace = true
rustls.workspace = true
self_update.workspace = true
serde.workspace = true
serde_json.workspace = true
# sha2 required by selfupdate
sha2.workspace = true
tar.workspace = true
tempfile.workspace = true
textwrap.workspace = true
volta-core.workspace = true
volta-migrate.workspace = true
which.workspace = true

[dev-dependencies]
cfg-if.workspace = true
ci_info.workspace = true
envoy.workspace = true
hamcrest2.workspace = true
headers.workspace = true
test-support.workspace = true

[target."cfg(windows)".dependencies]
winreg.workspace = true
# ziprs required by selfupdate
zip_rs.workspace = true

[features]
cross-platform-docs = ["volta-core/cross-platform-docs"]
mock-network = ["mockito", "volta-core/mock-network"]
smoke-tests = []

[profile.release]
opt-level = 3
debug = "line-tables-only"
split-debuginfo = "packed"
strip = "debuginfo"
lto = "fat"
panic = "abort"
codegen-units = 1

[profile.ci]
inherits = "release"
debug = false
strip = "none"
lto = false
codegen-units = 16

[profile.release-debug]
inherits = "release"
debug = true
strip = "none"
